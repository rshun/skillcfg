[workspace]
resolver = "2"
members = ["crates/skill-core", "crates/skill-io", "crates/skill-app", "crates/skill-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
serde_yaml = "=0.9.34"
thiserror = "=2.0.21"
toml_edit = "=0.22.27"
