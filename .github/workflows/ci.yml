name: Stage CI

on:
  push:
    branches: ['dev/**']
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      refresh_lockfile:
        type: boolean
        default: false
        description: Regenerate the dependency lockfile in GitHub only

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lockfile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: '1.90.0'
      - name: Generate lockfile only when required
        shell: bash
        env:
          REFRESH_LOCKFILE: ${{ inputs.refresh_lockfile }}
        run: |
          if [ ! -f Cargo.lock ] || [ "$REFRESH_LOCKFILE" = true ]; then
            cargo generate-lockfile
          else
            cargo update --workspace
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cargo-lock
          path: Cargo.lock
          retention-days: 14

  tests:
    needs: lockfile
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: '1.90.0'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: cargo-lock
      - name: Test all implemented stage components
        run: cargo test --workspace --locked --no-fail-fast

  quality:
    needs: lockfile
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: '1.90.0'
          components: rustfmt, clippy
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: cargo-lock
      - name: Format in GitHub and expose an editable patch
        run: |
          cargo fmt --all
          git diff --binary -- crates > formatting.patch
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: formatting-patch
          path: formatting.patch
          retention-days: 14
      - name: Check checked-in formatting
        run: git diff --exit-code -- crates
      - name: Check checked-in lockfile matches generated workspace graph
        run: git diff --exit-code -- Cargo.lock
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
