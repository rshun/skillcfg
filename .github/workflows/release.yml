name: Release Bundles and Smoke

on:
  push:
    branches: ['dev/**']
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      publish_tag:
        type: string
        required: false
        default: ''
        description: Optional tag (e.g. v0.2.0) to create and publish on master only after explicit approval

permissions:
  contents: read

concurrency:
  group: release-bundles-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-dist:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm --prefix apps/web ci
      - run: npm --prefix apps/web run build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-web-dist
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 14

  bundles:
    needs: web-dist
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x64
            bundles: deb,appimage
            exe_ext: ''
            python_cmd: python3
          - os: windows-2022
            platform: windows-x64
            bundles: nsis,msi
            exe_ext: .exe
            python_cmd: python
          - os: macos-15
            platform: macos-arm64
            bundles: app,dmg
            exe_ext: ''
            python_cmd: python3
          - os: macos-15-intel
            platform: macos-x64
            bundles: app,dmg
            exe_ext: ''
            python_cmd: python3
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: '1.90.0'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Linux native packaging and smoke prerequisites (GitHub runner only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf file xdg-utils xvfb
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-web-dist
          path: apps/web/dist
      - run: npm --prefix apps/web ci
      - name: Generate native icon set in GitHub
        working-directory: apps/web
        run: npx --no-install tauri icon ../../resources/desktop-icon.svg --output src-tauri/icons
      - name: Build native CLI release binary
        run: cargo build --release --locked -p skill-cli
      - name: Pre-warm Tauri bundler tools via GitHub API
        if: runner.os == 'Linux' || runner.os == 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ${{ matrix.python_cmd }} - <<'PY'
          import hashlib, json, os, pathlib, subprocess, tempfile, time, zipfile

          def api_download_asset(repo: str, tag: str, asset_name: str, dest: pathlib.Path) -> None:
              dest.parent.mkdir(parents=True, exist_ok=True)
              for attempt in range(1, 6):
                  try:
                      meta_raw = subprocess.check_output(
                          ['gh', 'api', f'repos/{repo}/releases/tags/{tag}'],
                          text=True,
                      )
                      assets = json.loads(meta_raw).get('assets', [])
                      match = next((a for a in assets if a.get('name') == asset_name), None)
                      if not match:
                          raise RuntimeError(f'Asset {asset_name} not found in {repo}@{tag}')
                      part = dest.with_name(dest.name + '.part')
                      with part.open('wb') as fh:
                          subprocess.run(
                              ['gh', 'api', '-H', 'Accept: application/octet-stream', f"repos/{repo}/releases/assets/{match['id']}"],
                              stdout=fh,
                              check=True,
                          )
                      if part.stat().st_size == match['size'] and part.stat().st_size > 0:
                          part.replace(dest)
                          return
                  except Exception as exc:
                      print(f'attempt {attempt} for {repo}@{tag}/{asset_name} failed: {exc}', flush=True)
                  time.sleep(attempt * 3)
              raise SystemExit(f'Failed to pre-warm {repo}@{tag}/{asset_name}')

          if os.name == 'nt':
              tools = pathlib.Path(os.environ['LOCALAPPDATA']) / 'tauri'
              tools.mkdir(parents=True, exist_ok=True)
              with tempfile.TemporaryDirectory() as tmp:
                  tmp_dir = pathlib.Path(tmp)
                  if not (tools / 'NSIS' / 'NSIS.exe').is_file():
                      nsis_zip = tmp_dir / 'nsis-3.13.zip'
                      api_download_asset('tauri-apps/binary-releases', 'nsis-3.13', 'nsis-3.13.zip', nsis_zip)
                      assert hashlib.sha1(nsis_zip.read_bytes()).hexdigest().lower() == 'db14f8af2ea346b786c6ae19343f61aaf5e09b8e'
                      with zipfile.ZipFile(nsis_zip) as zf:
                          zf.extractall(tools)
                      (tools / 'nsis-3.13').rename(tools / 'NSIS')
                  nsis_util = tools / 'NSIS' / 'Plugins' / 'x86-unicode' / 'additional' / 'nsis_tauri_utils.dll'
                  if not nsis_util.is_file():
                      api_download_asset('tauri-apps/nsis-tauri-utils', 'nsis_tauri_utils-v0.5.3', 'nsis_tauri_utils.dll', nsis_util)
                      assert hashlib.sha1(nsis_util.read_bytes()).hexdigest().lower() == '75197fee3c6a814fe035788d1c34ead39349b860'
                  if not (tools / 'WixTools314' / 'candle.exe').is_file():
                      wix_zip = tmp_dir / 'wix314-binaries.zip'
                      api_download_asset('wixtoolset/wix3', 'wix3141rtm', 'wix314-binaries.zip', wix_zip)
                      assert hashlib.sha256(wix_zip.read_bytes()).hexdigest().lower() == '6ac824e1642d6f7277d0ed7ea09411a508f6116ba6fae0aa5f2c7daa2ff43d31'
                      (tools / 'WixTools314').mkdir(parents=True, exist_ok=True)
                      with zipfile.ZipFile(wix_zip) as zf:
                          zf.extractall(tools / 'WixTools314')
          else:
              xdg = os.environ.get('XDG_CACHE_HOME') or str(pathlib.Path.home() / '.cache')
              tools = pathlib.Path(xdg) / 'tauri'
              tools.mkdir(parents=True, exist_ok=True)
              for repo, tag, asset, target in [
                  ('tauri-apps/binary-releases', 'apprun-old', 'AppRun-x86_64', 'AppRun-x86_64'),
                  ('tauri-apps/binary-releases', 'linuxdeploy-07333c6', 'linuxdeploy-x86_64.AppImage', 'linuxdeploy-07333c6-x86_64.AppImage'),
                  ('linuxdeploy/linuxdeploy-plugin-appimage', 'continuous', 'linuxdeploy-plugin-appimage-x86_64.AppImage', 'linuxdeploy-plugin-appimage.AppImage'),
              ]:
                  dest = tools / target
                  if not dest.is_file():
                      api_download_asset(repo, tag, asset, dest)
                      dest.chmod(0o755)
          print(f'Pre-warmed Tauri bundler cache in {tools}', flush=True)
          PY
      - name: Bundle native desktop installers
        working-directory: apps/web
        shell: bash
        env:
          CI: 'true'
          APPIMAGE_EXTRACT_AND_RUN: '1'
          NO_STRIP: 'true'
        run: |
          CFG="$(cd src-tauri && (pwd -W 2>/dev/null || pwd))/tauri.bundle.json"
          for attempt in 1 2 3 4 5; do
            if npx --no-install tauri build --features custom-protocol --config "$CFG" --bundles "${{ matrix.bundles }}" -- --locked; then
              exit 0
            fi
            echo "tauri bundle attempt $attempt failed (likely transient GitHub release CDN 504); retrying..."
            sleep $((attempt * 4))
          done
          exit 1
      - name: Run native desktop launch smoke and zero-recompilation fifth-agent check
        shell: bash
        run: ${{ matrix.python_cmd }} scripts/smoke_desktop.py --desktop-bin "apps/web/src-tauri/target/release/skill-hub-desktop${{ matrix.exe_ext }}" --cli-bin "target/release/skill-hub${{ matrix.exe_ext }}" --platform "${{ matrix.platform }}" --report "smoke-report-${{ matrix.platform }}.json"
      - name: Stage installers, portable bundle, CLI archive, and host baseline
        shell: bash
        run: ${{ matrix.python_cmd }} scripts/package_desktop.py stage --platform "${{ matrix.platform }}" --bundle-dir "apps/web/src-tauri/target/release/bundle" --desktop-bin "apps/web/src-tauri/target/release/skill-hub-desktop${{ matrix.exe_ext }}" --cli-bin "target/release/skill-hub${{ matrix.exe_ext }}" --smoke-report "smoke-report-${{ matrix.platform }}.json" --output "staged-${{ matrix.platform }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: staged-${{ matrix.platform }}
          path: staged-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 14

  release-summary:
    needs: bundles
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: staged-*
          path: downloaded-staged
      - name: Verify all 3-platform bundles and generate SHA-256 checksums without publishing
        run: |
          python3 scripts/package_desktop.py finalize --input downloaded-staged --output dist-bundles
          cat dist-bundles/BUILD-BASELINE.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: skill-hub-release-bundles
          path: dist-bundles
          if-no-files-found: error
          retention-days: 14

  publish-release:
    needs: release-summary
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' && inputs.publish_tag != '' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: skill-hub-release-bundles
          path: dist-bundles
      - name: Verify manifest version, SHA-256 digests, and publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_TAG: ${{ inputs.publish_tag }}
        run: |
          EXPECTED_TAG="$(python3 -c 'import pathlib, sys; sys.path.insert(0, "scripts"); import package_desktop; print("v" + package_desktop.verified_version(pathlib.Path(".")))')"
          if [ "$PUBLISH_TAG" != "$EXPECTED_TAG" ]; then
            echo "Tag mismatch: publish_tag=$PUBLISH_TAG expected=$EXPECTED_TAG" >&2
            exit 1
          fi
          NOTES_FILE="docs/releases/${PUBLISH_TAG}.md"
          if [ ! -f "$NOTES_FILE" ]; then
            echo "Missing release notes: $NOTES_FILE" >&2
            exit 1
          fi
          (cd dist-bundles && sha256sum -c SHA256SUMS.txt)
          gh release create "$PUBLISH_TAG" \
            dist-bundles/skill-hub-* \
            dist-bundles/SHA256SUMS.txt \
            dist-bundles/BUILD-BASELINE.md \
            --target "$GITHUB_SHA" \
            --title "Skill Hub $PUBLISH_TAG" \
            --notes-file "$NOTES_FILE"
