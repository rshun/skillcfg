[package]
name = "skill-desktop"
version = "0.3.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"

[workspace]

[lib]
name = "skill_desktop"

[[bin]]
name = "skill-hub-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = "=2.7.4"

[features]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = "=2.12.5"
tauri-plugin-dialog = "=2.8.4"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
skill-app = { path = "../../../crates/skill-app" }
skill-core = { path = "../../../crates/skill-core" }
skill-io = { path = "../../../crates/skill-io" }
